x-app: &app
  build: .
  image: forge-media:local
  init: true
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+psycopg://forge:forge_dev@postgres:5432/forge
    REDIS_URL: redis://redis:6379/0
    LOCAL_STORAGE_PATH: /srv/forge/data/storage
    WEBHOOK_MASTER_SECRET: ${WEBHOOK_MASTER_SECRET:?Set WEBHOOK_MASTER_SECRET in .env}
    JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
    JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-30}
    JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-300}
    JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-600}
    JOB_RECOVERY_GRACE_SECONDS: ${JOB_RECOVERY_GRACE_SECONDS:-120}
  volumes:
    - media-data:/srv/forge/data/storage
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-ready: &ready
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: *ready
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  worker:
    <<: *app
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    stop_grace_period: 11m
    depends_on: *ready
  dispatcher:
    <<: *app
    command: ["python", "-m", "app.dispatcher"]
    depends_on: *ready
  webhooks:
    <<: *app
    command: ["python", "-m", "app.webhook_worker"]
    stop_grace_period: 20s
    depends_on: *ready
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  media-data:
  redis-data:
  postgres-data:
